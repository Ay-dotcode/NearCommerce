# Render "Blueprint" for the API. In Render: New -> Blueprint -> pick this repository.
# Auto-deploy is off on purpose: the GitHub workflow runs the tests, updates the database, and
# then asks Render to deploy (through the deploy hook), so broken code never goes live.
services:
  - type: web
    name: nearcommerce-api
    runtime: node
    plan: free
    autoDeploy: false
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm --filter @nearcommerce/backend start
    healthCheckPath: /support
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL # Neon connection string
        sync: false
      - key: REDIS_URL # Upstash "rediss://" URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL # your store-owner portal address, e.g. https://nearcommerce-owner.pages.dev
        sync: false
      - key: GEMINI_API_KEY # optional: smart search
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
