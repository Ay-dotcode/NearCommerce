version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Expo SDK pins the exact supported React Native version; only upgrade via `npx expo install`.
      - dependency-name: "react-native"
      - dependency-name: "react-native-safe-area-context"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
